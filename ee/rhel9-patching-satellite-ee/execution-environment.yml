---
version: 3

images:
  base_image:
    # name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest
    name: registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel9:latest

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_files:
  - src: ansible.cfg
    dest: configs

additional_build_steps:
  prepend_galaxy:
    - ADD _build/configs/ansible.cfg /etc/ansible/ansible.cfg

  prepend_final:
    - RUN pip3 install --upgrade pip
    - RUN pip3 install git+https://github.com/vmware/vsphere-automation-sdk-python.git

  append_final:
    - RUN microdnf install -y python3-pip && microdnf clean all
    - LABEL vendor="RHEL 9.x Upgrade"
    - LABEL version="1.0.0"
    - LABEL description="RHEL 9.x Upgrade EE with VMware and Satellite support"

options:
  package_manager_path: /usr/bin/microdnf