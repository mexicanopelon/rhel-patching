---
- name: Set VM name fact
  ansible.builtin.set_fact:
    vm_name: "{{ vmware_guest_name | default(inventory_hostname) }}"
    snapshot_name: "pre_upgrade_{{ ansible_date_time.date }}"

- name: Display VM name being used
  ansible.builtin.debug:
    msg: "Using VM name: {{ vm_name }}"

- name: Get VM Info
  vmware.vmware.guest_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ vm_name }}"
    validate_certs: false
  delegate_to: localhost
  register: vm_info

- name: Print vm_info
  ansible.builtin.debug:
    var: vm_info

- name: Step 2 - Shutdown the VM
  vmware.vmware.vm_powerstate:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ vm_name }}"
    state: shutdown-guest
    validate_certs: "{{ vcenter_validate_certs | default(false) }}"
  register: vm_shutdown
  delegate_to: localhost

- name: Wait for VM to power off
  vmware.vmware.guest_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ vm_name }}"
    validate_certs: "{{ vcenter_validate_certs | default(false) }}"
  register: vm_powerstate
  until: vm_powerstate.guest_info.hw_power_status == "poweredOff"
  retries: 30
  delay: 10
  delegate_to: localhost


- name: Gather guest vm info
  vmware.vmware.guest_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: false
    guest_name: "my_vm"

- name: Step 3 - Take VMware snapshot
  vmware.vmware.vm_snapshot:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ vm_name }}"
    state: present
    snapshot_name: "{{ snapshot_name }}"
    description: "Pre-upgrade snapshot before RHEL {{ target_version }} upgrade"
    memory_dump: false
    quiesce: false
    validate_certs: "{{ vcenter_validate_certs | default(false) }}"
  register: snapshot_result
  delegate_to: localhost

- name: Record snapshot name for rollback
  ansible.builtin.set_fact:
    upgrade_snapshot_name: "{{ snapshot_name }}"

- name: Step 4 - Power on the VM
  vmware.vmware.vm_powerstate:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ vm_name }}"
    state: powered-on
    validate_certs: "{{ vcenter_validate_certs | default(false) }}"
  register: vm_poweron
  delegate_to: localhost

- name: Wait for system to boot and become reachable
  ansible.builtin.wait_for_connection:
    delay: 30
    timeout: 300

- name: Regather facts after boot
  ansible.builtin.setup:
