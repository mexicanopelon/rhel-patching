---
- name: Make DNF cache
  ansible.builtin.command: dnf makecache
  changed_when: true

- name: Check for available updates
  ansible.builtin.dnf:
    list: updates
  register: available_updates

- name: Display update count
  ansible.builtin.debug:
    msg: "Found {{ available_updates.results | length }} available updates"

- name: Step 6 - Apply all updates  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  register: update_result
  async: 3600
  poll: 30

- name: Display update result
  ansible.builtin.debug:
    msg: "Updates applied: {{ update_result.changed }}"
